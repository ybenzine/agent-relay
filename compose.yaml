services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: relay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only; lets `pytest` on the host reach the database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  agent-relay:
    build: .
    image: agent-relay:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:${POSTGRES_PASSWORD:-relay}@postgres:5432/relay
      # Uncomment for a shared installation:
      # RELAY_ENROLLMENT_SECRET: change-me
    ports:
      - "${RELAY_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres-data:
